name: frontend_flutter
description: "NeuroGuardian - AI-Powered Alzheimer's Assistance and Brain Health Monitoring System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Firebase Core & Services
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9

  # Local Notifications & Location
  flutter_local_notifications: ^17.0.0
  geolocator: ^11.0.0
  google_maps_flutter: ^2.6.0

  # QR Code Generation
  qr_flutter: ^4.1.0

  # UI Design, Fonts & HTTP
  google_fonts: ^6.1.0
  animate_do: ^3.3.4
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
